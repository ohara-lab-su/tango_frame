[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "tango-frame"
version = "0.1.1"
description = "Automatic TANGO dispatch framework for ordinary Python device classes"
requires-python = ">=3.8"
dependencies = ["pytango>=10"]

[tool.setuptools.packages.find]
where = ["src"]
