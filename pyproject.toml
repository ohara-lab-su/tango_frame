[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "tango-frame"
version = "0.1.5"
description = "TANGO device-server framework for exposing ordinary Python device classes without coupling device logic to communication."
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "pytango>=10",
    "xlogger-py"
]

[tool.setuptools.packages.find]
where = ["src"]

[project.urls]
Homepage = "https://ohara-lab-su.github.io/tango_frame/"
Documentation = "https://ohara-lab-su.github.io/tango_frame/"
Repository = "https://github.com/ohara-lab-su/tango_frame"
Issues = "https://github.com/ohara-lab-su/tango_frame/issues"
